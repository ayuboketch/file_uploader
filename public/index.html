<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Upload API – Tech Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e5ff;
      --text: #e0e0e0;
      --sub: #9e9e9e;
      --radius: 12px;
      --transition: all .3s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 3rem 4rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 { font-size: 1.75rem; margin-bottom: .5rem; }
    p  { color: var(--sub); margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: .9rem 2rem;
      border: none;
      border-radius: var(--radius);
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 229, 255, .4); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Excel Upload API</h1>
    <p>Tech-test backend is running.</p>
    <a class="btn" href="/upload.html">Launch Upload Form</a>
  </div>
</body>
</html>
