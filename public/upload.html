<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Excel Upload | Tech Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e5ff;
      --text: #e0e0e0;
      --sub: #9e9e9e;
      --radius: 12px;
      --transition: all .3s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 2rem;
    }
    .card {
      background: var(--card);
      padding: 3rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: .5rem; }
    p  { color: var(--sub); margin-bottom: 2rem; }
    .file-box {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    input[type=file] {
      position: absolute;
      left: -9999px;
    }
    .file-label {
      display: block;
      background: transparent;
      border: 2px dashed var(--accent);
      color: var(--accent);
      padding: 1.2rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
    }
    .file-label:hover { background: rgba(0, 229, 255, .08); }
    input[type=file]:focus + .file-label { box-shadow: 0 0 0 3px rgba(0, 229, 255, .4); }
    .btn {
      margin-top: 1.5rem;
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: .9rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 229, 255, .4); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    #log {
      margin-top: 1.5rem;
      font-size: .9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .success { color: #00ff95; }
    .error   { color: #ff5252; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload <code>data.xlsx</code></h1>
    <p>Select the spreadsheet to import into the database.</p>

    <form id="upForm" enctype="multipart/form-data">
      <div class="file-box">
        <input type="file" id="fileInp" name="file" accept=".xlsx" required />
        <label class="file-label" for="fileInp">Choose file…</label>
      </div>
      <button class="btn" type="submit">Import Data</button>
    </form>

    <div id="log"></div>
  </div>

  <script>
    const form   = document.getElementById('upForm');
    const fileInp= document.getElementById('fileInp');
    const log    = document.getElementById('log');

    fileInp.addEventListener('change', () => {
      const name = fileInp.files[0]?.name || 'Choose file…';
      fileInp.nextElementSibling.textContent = name;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInp.files.length) return;
      log.textContent = 'Uploading…';
      log.className = '';

      const fd = new FormData(form);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const j   = await res.json();
        if (res.ok) {
          log.textContent = `✅ Inserted ${j.inserted} rows`;
          log.className = 'success';
        } else {
          log.textContent = `❌ ${j.error}`;
          log.className = 'error';
        }
      } catch (err) {
        log.textContent = '❌ Network error';
        log.className = 'error';
      }
    });
  </script>
</body>
</html>
